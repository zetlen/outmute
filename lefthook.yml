# outmute doesn't use Git LFS; skip_lfs avoids lefthook silently invoking
# `git lfs pre-push` (and swallowing its failures) whenever git-lfs happens
# to be installed/configured on the host machine. See evilmartians/lefthook#356.
skip_lfs: true

pre-commit:
  commands:
    fmt:
      glob: "*.{ts,tsx,js,jsx,json}"
      run: bunx oxfmt --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: bunx oxlint {staged_files}

pre-push:
  commands:
    typecheck:
      run: bun run typecheck
    test:
      run: bun test
