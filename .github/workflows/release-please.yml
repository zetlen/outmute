name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A PAT, not GITHUB_TOKEN: releases/PRs made by the default token don't
      # trigger other workflows (release.yml wouldn't fire), and this repo
      # also disallows Actions-authored PRs outright.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
