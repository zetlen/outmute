name: Feature request
description: Suggest a new capability or an improvement to an existing one.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that outmute makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >-
        What should outmute do instead? If it involves the CLI, sketch the flag
        or subcommand you would expect.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you have solved or worked around this.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — the tracker you export from, a sample invoice layout, links.
    validations:
      required: false
